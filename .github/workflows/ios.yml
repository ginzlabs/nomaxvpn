name: ios

on:
  push:
    branches: [main]
    paths: [apple/**, core/**, check/**, internal/apiclient/**, internal/check/**, internal/directory/**, internal/profile/**, internal/xray/**, go.mod, go.sum, .github/workflows/ios.yml]
  schedule:
    - cron: "0 6 1 * *" # monthly, so a fresh build is always well inside TestFlight's 90 days (beta review stays manual: make beta-review)
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight (off = signed build only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios
  cancel-in-progress: false

jobs:
  testflight:
    if: vars.TESTFLIGHT == 'on' # set by `make gh-secrets` once the app record and signing exist
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: brew install xcodegen
      - name: Secrets and keychain
        env:
          NOMAX_ENV: ${{ secrets.NOMAX_ENV }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
        run: |
          umask 077
          printf '%s\n' "$NOMAX_ENV" > _cert/nomax.env
          grep -E '^(ADMIN_CODE|ADMIN_PATH|API_PATH|FILES_PATH|PRIVACY_PATH|REVIEW_CODE|REALITY_PRIVATE_KEY|WG_PRIVATE_KEY|DIST_P12_PASSWORD|ANDROID_KEYSTORE_PASSWORD|MAC_INSTALLER_P12_PASSWORD)=.' _cert/nomax.env | cut -d= -f2- | sed 's/^/::add-mask::/'
          set -a; source _cert/nomax.env; set +a
          printf '%s\n' "$ASC_KEY_P8" > "_cert/$ASC_KEY_FILE"
          echo "$DIST_P12_BASE64" | base64 --decode > _cert/apple-distribution.p12
          KC="$RUNNER_TEMP/ci.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security import _cert/apple-distribution.p12 -k "$KC" -f pkcs12 -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          if [ -n "$MAC_INSTALLER_P12_BASE64" ]; then
            echo "$MAC_INSTALLER_P12_BASE64" | base64 --decode > _cert/mac-installer.p12
            security import _cert/mac-installer.p12 -k "$KC" -f pkcs12 -P "$MAC_INSTALLER_P12_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/security
          fi
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KC" >/dev/null
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - run: make testflight ${{ github.event_name == 'workflow_dispatch' && !inputs.upload && 'TESTFLIGHT_ARGS=-no-upload' || '' }}
        env:
          WHATS_NEW: ${{ github.event.head_commit.message || 'Monthly refresh' }}
      - run: make testflight-mac ${{ github.event_name == 'workflow_dispatch' && !inputs.upload && 'TESTFLIGHT_ARGS=-no-upload' || '' }}
        env:
          WHATS_NEW: ${{ github.event.head_commit.message || 'Monthly refresh' }}
