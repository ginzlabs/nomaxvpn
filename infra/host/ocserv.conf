# OpenConnect (Cisco AnyConnect protocol). nomax owns the password file and
# certificate, and forwards TLS for m.$DOMAIN on 443 to the TCP port here.
# ops deploy adds the camouflage secret at the end.
auth = "plain[passwd=/var/lib/nomax/ocserv/passwd]"
server-cert = /var/lib/nomax/ocserv/cert.pem
server-key = /var/lib/nomax/ocserv/key.pem

listen-proxy-proto = true
tcp-port = 4443
udp-port = 4443
run-as-user = ocserv
run-as-group = ocserv
socket-file = run/ocserv-socket
chroot-dir = /var/lib/ocserv
isolate-workers = true
use-occtl = true
pid-file = /run/ocserv.pid

# TLS 1.3 gives clients the keying material DTLS needs; without it the data
# stays on TCP.
tls-priorities = "NORMAL:%SERVER_PRECEDENCE:%COMPAT:-VERS-SSL3.0:-VERS-TLS1.0:-VERS-TLS1.1"
cisco-client-compat = true
dtls-legacy = true

max-clients = 0
max-same-clients = 0
keepalive = 32400
dpd = 90
mobile-dpd = 1800
switch-to-tcp-timeout = 25
try-mtu-discovery = true
cookie-timeout = 300
deny-roaming = false
auth-timeout = 240
max-ban-score = 80
ban-reset-time = 1200

device = vpns
predictable-ips = true
ipv4-network = 10.8.3.0
ipv4-netmask = 255.255.255.0
ipv6-network = fd08:3::/64
ipv6-subnet-prefix = 128
route = default
tunnel-all-dns = true
dns = 1.1.1.1
dns = 1.0.0.1
dns = 2606:4700:4700::1111
